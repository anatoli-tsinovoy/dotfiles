# Match the old dark SketchyBar even when macOS is in Light appearance.
[workspaceBar]
barFill = "background/0.85"
barBorder = "border/0.55"

[light]
background = "#110034"
surface = "#1D0947"
elevatedSurface = "#28105D"
border = "#330D81"
foreground = "#F3F0DF"
secondaryForeground = "#F3F0DF"
mutedForeground = "#C4AEE3"
accent = "#00C8AB"
accentForeground = "#110034"
focus = "#00C8AB"
purple = "#8217FF"
warning = "#FFD44F"
error = "#FF4F44"

[dark]
background = "#110034"
surface = "#1D0947"
elevatedSurface = "#28105D"
border = "#330D81"
foreground = "#F3F0DF"
secondaryForeground = "#F3F0DF"
mutedForeground = "#C4AEE3"
accent = "#00C8AB"
accentForeground = "#110034"
focus = "#00C8AB"
purple = "#8217FF"
warning = "#FFD44F"
error = "#FF4F44"
