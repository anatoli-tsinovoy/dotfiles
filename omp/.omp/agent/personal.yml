# Personal ChatGPT subscription overlay. Use with:
#   omp --config ~/.omp/agent/personal.yml
# Authenticate once in the shared/default agent store with:
#   /login openai-codex
modelRoles:
  default: openai-codex/gpt-6-astra:low
  smol: openai-codex/gpt-5.6-luna:xhigh
  slow: openai-codex/gpt-5.6-sol:xhigh
  designer: openai-codex/gpt-6-astra
  vision: openai-codex/gpt-6-astra
  plan: openai-codex/gpt-6-astra:high
  task: openai-codex/gpt-5.6-luna:max
  commit: openai-codex/gpt-5.6-luna:off
  tiny: openai-codex/gpt-5.6-luna:medium
  advisor: openai-codex/gpt-6-astra:high

# Codex shares the OpenAI tier family: no Flex support or paid Priority.
tier:
  openai: none
  subagent: none
  advisor: none
task:
  # Mappings deep-merge; explicitly neutralize every base-config override.
  agentServiceTierOverrides:
    scout: none
    task: none
    sonic: none

enabledModels:
  - openai-codex/*

disabledProviders:
  - openai
  - amazon-bedrock
  - bedrock-mantle
  - bedrock-openai
