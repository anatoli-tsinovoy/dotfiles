providers:
  openai:
    apiKey: "!cat $HOME/.omp/agent/keys/openai"
  amazon-bedrock:
    apiKey: "!cat $HOME/.omp/agent/keys/bedrock"
  bedrock-mantle:
    apiKey: "!cat $HOME/.omp/agent/keys/bedrock"
  bedrock-openai:
    baseUrl: https://bedrock-mantle.us-east-1.api.aws/openai/v1
    api: openai-responses
    apiKey: "!cat $HOME/.omp/agent/keys/bedrock"
    authHeader: true
    models:
      - id: openai.gpt-5.6-sol
        name: GPT-5.6 Sol via Bedrock Mantle
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 128000
        cost:
          input: 5.5
          output: 33.0
          cacheRead: 0.55
          cacheWrite: 6.88

  mlx-lm:
    baseUrl: http://localhost:8080/v1
    api: openai-completions
    apiKey: none
    models:
      - id: mlx-community/Qwen3.6-35B-A3B-8bit
  llama-cpp:
    baseUrl: http://localhost:8000/v1
    api: openai-completions
    apiKey: none
    models:
      - id: deepreinforce-ai/Ornith-1.0-9B-GGUF
      - id: deepreinforce-ai/Ornith-1.0-35B-GGUF
