modelRoles:
  # OMP instructions: ~/dotfiles/omp/.omp/agent/SYSTEM.md, stowed to ~/.omp/agent/SYSTEM.md.
  # Native discovery activates it on a new session; no systemPrompt setting is needed.
  # Main-session-wide: switching models does not switch prompts. CLI/project overrides win.
  default: openai/gpt-6-astra:medium
  smol: openai/gpt-5.6-luna:xhigh
  slow: openai/gpt-5.6-sol:xhigh
  designer: openai/gpt-6-astra
  vision: openai/gpt-5.6-sol
  plan: openai/gpt-6-astra:high
  task: openai/gpt-5.6-luna:max
  commit: openai/gpt-5.6-luna:off
  tiny: openai/gpt-5.6-luna:medium
  advisor: openai/gpt-5.6-sol:high
# Native tiers (per-agent overrides require upstream PR #9668).
# These follow agent names, not model switches; Luna-backed agents use Priority below.
tier:
  openai: flex
  subagent: inherit
  advisor: inherit
hideThinkingBlock: true
theme:
  light: light
  dark: dark
symbolPreset: nerd
colorBlindMode: false
compaction:
  thresholdPercent: 70
  handoffSaveToDisk: true
  thresholdTokens: 229000
  methodOrder:
    - remote
    - soft
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
browser:
  headless: true
setupVersion: 2
contextPromotion:
  enabled: false
dev:
  autoqaConsent: denied
github:
  enabled: true
task:
  showResolvedModelBadge: true
  enableLsp: true
  eager: preferred
  agentServiceTierOverrides:
    scout: priority
    task: priority
    sonic: priority
tools: {}
providers: {}
advisor:
  enabled: false
doubleEscapeAction: rewind
marketplace:
  autoUpdate: auto
stt:
  enabled: true
speech:
  enabled: false
  enhanced: true
statusLine:
  sessionAccent: false
  transparent: true
  compactThinkingLevel: true
  showHookStatus: true
tui:
  scrollbackRebuild: true
  textSizing: false
display:
  cacheMissMarker: true
  showTokenUsage: true
  showTurnTime: true
terminal:
  showImages: true
generate_image:
  enabled: true
edit:
  mode: hashline
astGrep:
  enabled: true
composer:
  shape: box
extendedContext: false
branchSummary:
  enabled: true
memory:
  backend: sharpshooter
codexResets:
  autoRedeem: "no"
steeringMode: all
ttsr:
  contextMode: discard
